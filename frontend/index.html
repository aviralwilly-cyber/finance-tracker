        <p>
          This is a free, open-source personal budgeting project built by an
          independent developer as a portfolio piece. It lets you record your own
          spending by hand, group it into categories, set monthly limits, and ask
          plain-English questions about the numbers you entered.

          email-and-password login for this app itself, handled by Firebase
          Authentication.
